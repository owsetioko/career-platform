[project]
name = "personal-resume-platform"
version = "0.1.0"
description = "A personal resume site built with FastAPI, Jinja2, SQLite, and plain CSS."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<0.120",
    "argon2-cffi>=23.1,<26.0",
    "itsdangerous>=2.2,<3.0",
    "jinja2>=3.1,<4.0",
    "python-multipart>=0.0.9,<1.0",
    "python-dotenv>=1.0,<2.0",
    "sqlalchemy>=2.0,<3.0",
    "uvicorn[standard]>=0.30,<1.0",
    "psycopg[binary]>=3.2,<4.0",
]

[dependency-groups]
dev = [
    "httpx>=0.27,<1.0",
    "pytest>=8.3,<9.0",
]

[tool.uv]
# This is an app, not a library: uv installs its dependencies but does not
# build or install the project itself.
package = false
